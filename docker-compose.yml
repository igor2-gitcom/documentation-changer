# ============================================
# Docker Compose - Qwen3 Document Correction App
# ============================================
# Запуск: docker compose up -d
# Остановка: docker compose down
# Логи: docker compose logs -f

version: '3.8'

services:
  # ------------------------------------------
  # Frontend - React + Vite (nginx)
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen3-docs-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qwen3-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ------------------------------------------
  # Backend - Node.js API proxy for Qwen3
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qwen3-docs-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_BASE_URL=${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - QWEN_MODEL=${QWEN_MODEL:-qwen3}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    networks:
      - qwen3-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ------------------------------------------
  # (Optional) Nginx reverse proxy with SSL
  # ------------------------------------------
  # nginx-proxy:
  #   image: nginx:1.25-alpine
  #   container_name: qwen3-nginx-proxy
  #   restart: unless-stopped
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - frontend
  #   networks:
  #     - qwen3-network

networks:
  qwen3-network:
    driver: bridge
