# ============================================
# Docker Compose - vLLM (Production с GPU)
# ============================================
# Высокопроизводительный сервер для закрытой сети
#
# Запуск: docker compose -f docker-compose.vllm.yml up -d
# Модель должна быть в ~/models/Qwen3-8B/

version: '3.8'

services:
  # ------------------------------------------
  # vLLM - Высокопроизводительный LLM сервер
  # ------------------------------------------
  vllm:
    image: vllm/vllm-openai:latest
    container_name: qwen3-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    # vLLM запускается с параметрами
    command: >
      --model /models/Qwen3-8B
      --served-model-name qwen3
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${TP_SIZE:-1}
      --max-model-len ${MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${GPU_MEM_UTIL:-0.9}
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: '10.24gb'
    networks:
      - qwen3-vllm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ------------------------------------------
  # Backend - API proxy
  # ------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qwen3-docs-backend-vllm
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - QWEN_API_KEY=empty
      - QWEN_BASE_URL=http://vllm:8000/v1
      - QWEN_MODEL=qwen3
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - qwen3-vllm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ------------------------------------------
  # Frontend - React + Vite (nginx)
  # ------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen3-docs-frontend-vllm
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qwen3-vllm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  qwen3-vllm-network:
    driver: bridge
